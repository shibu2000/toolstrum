<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Toolstrum - 480+ Everyday Offline Tools in one powerful, 100% private browser workspace. No cloud uploads, runs completely in your browser." />
    <meta name="theme-color" content="#625BFF" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Toolstrum — 490+ Free Offline Tools (100% Client-Side)</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('toolstrum_theme_v1');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
